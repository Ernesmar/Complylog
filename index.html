<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComplyLog Pro - Compliance Management</title>
    <meta name="theme-color" content="#0a0a0b">
    <script>
(function(g){'use strict';
function createClient(url,key){
var h={'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json'};
async function req(m,p,b){var u=url+'/rest/v1'+p;var o={method:m,headers:h};if(b){o.body=JSON.stringify(b);o.headers['Prefer']='return=representation';}
var r=await fetch(u,o);if(!r.ok){var t=await r.text();var e;try{e=JSON.parse(t)}catch(e){e={message:t}}return{data:null,error:e,status:r.status}}
var t=await r.text();if(!t)return{data:null,error:null,status:r.status};try{return{data:JSON.parse(t),error:null,status:r.status}}catch(e){return{data:t,error:null,status:r.status}}}
return{auth:{getSession:function(){return req('GET','/auth/v1/user').then(function(r){if(r.error)return{data:{session:null}};return{data:{session:{user:r.data}}}})},
signInWithPassword:function(c){return fetch(url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':key},body:JSON.stringify({email:c.email,password:c.password})}).then(function(r){return r.json()}).then(function(d){if(d.error)return{error:d};return{data:{user:d.user,session:d}}})},
signUp:function(c){return fetch(url+'/auth/v1/signup',{method:'POST',headers:{'Content-Type':'application/json','apikey':key},body:JSON.stringify({email:c.email,password:c.password})}).then(function(r){return r.json()}).then(function(d){if(d.error)return{error:d};return{data:{user:d}}})},
signInWithOAuth:function(o){window.location.href=url+'/auth/v1/authorize?provider='+o.provider+'&redirect_to='+encodeURIComponent(o.options.redirectTo);return{error:null}},
signOut:function(){localStorage.clear();return{error:null}}},
from:function(t){return{select:function(c){var p='/'+t+'?select='+encodeURIComponent(c||'*');var b={eq:function(col,val){p+='&'+encodeURIComponent(col)+'=eq.'+encodeURIComponent(val);return b},single:function(){p+='&limit=1';return b.then(function(r){if(r.error)return r;return{data:Array.isArray(r.data)?r.data[0]||null:r.data,error:null}})},then:function(res,rej){return req('GET',p).then(res,rej)},insert:function(v){return req('POST','/'+t,v)}};return b}}}}
g.supabaseLib={createClient:createClient}})(window);
</script>
    <style>
        :root{--bg:#0a0a0b;--bg-card:#141416;--bg-input:#1c1c1f;--border:#2a2a2e;--text:#f4f4f5;--text-secondary:#a1a1aa;--accent:#3b82f6;--radius:16px}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
        .container{max-width:400px;width:100%}
        .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:32px}
        .logo{text-align:center;font-size:24px;font-weight:700;margin-bottom:32px}
        .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border:none;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;margin-bottom:12px;font-family:inherit;transition:all 0.15s}
        .btn-google{background:white;color:#1f2937;border:1px solid #d1d5db}
        .btn-primary{background:var(--accent);color:white}
        .divider{display:flex;align-items:center;margin:20px 0;color:var(--text-secondary);font-size:13px}
        .divider::before,.divider::after{content:'';flex:1;border-bottom:1px solid var(--border)}
        .divider span{padding:0 16px}
        .form-group{margin-bottom:16px}
        .form-group label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--text-secondary)}
        .form-group input{width:100%;padding:10px 14px;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;font-family:inherit}
        .form-group input:focus{outline:none;border-color:var(--accent)}
        .text-link{color:var(--accent);cursor:pointer;font-weight:500}
        .alert{padding:12px;border-radius:8px;margin-bottom:16px;font-size:14px;display:none}
        .alert-success{background:rgba(34,197,94,0.2);color:#4ade80;display:block}
        .alert-error{background:rgba(239,68,68,0.2);color:#f87171;display:block}
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🛡️ ComplyLog Pro</div>
        <div class="card">
            <h2 style="text-align:center;margin-bottom:24px;" id="authTitle">Sign In</h2>
            <div id="authAlert" class="alert"></div>
            <button class="btn btn-google" onclick="googleAuth()">
                <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Continue with Google
            </button>
            <div class="divider"><span>or with email</span></div>
            <div id="extraFields"></div>
            <div class="form-group"><label>Email</label><input type="email" id="email" placeholder="you@company.com"></div>
            <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="••••••••"></div>
            <button class="btn btn-primary" id="authBtn" onclick="handleAuth()">Sign In</button>
            <p style="text-align:center;margin-top:16px;font-size:14px;color:var(--text-secondary);">
                <span id="switchText">Don't have an account?</span> <span class="text-link" onclick="toggleMode()" id="switchLink">Sign up free</span>
            </p>
        </div>
    </div>
    <script>
        var SUPABASE_URL='https://smyuylvztkigxruyywhb.supabase.co';
        var SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNteXV5bHZ6dGtpZ3hydXl5d2hiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NzA3NzUsImV4cCI6MjEwMTA0Njc3NX0.Rt-VEKGv03XaydxAhxbUkHWr1p0ifviWsKFsU_B-Tao';
        var supabaseClient;
        var isLogin=true;

        function toggleMode(){
            isLogin=!isLogin;
            document.getElementById('authTitle').textContent=isLogin?'Sign In':'Create Account';
            document.getElementById('authBtn').textContent=isLogin?'Sign In':'Create Account';
            document.getElementById('switchText').textContent=isLogin?"Don't have an account?":"Already have an account?";
            document.getElementById('switchLink').textContent=isLogin?'Sign up free':'Sign in';
            document.getElementById('extraFields').innerHTML=isLogin?'':'<div class="form-group"><label>Company Name</label><input id="companyName" placeholder="Your Company LLC"></div>';
            document.getElementById('authAlert').className='alert';
        }

        function showAlert(msg,type){
            var el=document.getElementById('authAlert');
            el.textContent=msg;el.className='alert alert-'+type;
        }

        async function init(){
            supabaseClient=supabaseLib.createClient(SUPABASE_URL,SUPABASE_KEY);
            var res=await supabaseClient.auth.getSession();
            if(res.data&&res.data.session)window.location.href='/app.html';
        }

        async function googleAuth(){
            await supabaseClient.auth.signInWithOAuth({provider:'google',options:{redirectTo:'https://declarcloudeployed.top/app.html'}});
        }

        async function handleAuth(){
            var email=document.getElementById('email').value;
            var password=document.getElementById('password').value;
            if(!email||!password)return showAlert('Please fill all fields','error');
            if(isLogin){
                var res=await supabaseClient.auth.signInWithPassword({email:email,password:password});
                if(res.error)showAlert(res.error.message,'error');
                else{showAlert('✅ Signed in!','success');setTimeout(function(){location.href='/app.html'},500);}
            }else{
                var company=document.getElementById('companyName')?.value;
                if(!company)return showAlert('Please enter company name','error');
                if(password.length<6)return showAlert('Password min 6 characters','error');
                var res=await supabaseClient.auth.signUp({email:email,password:password,options:{data:{company_name:company},emailRedirectTo:'https://declarcloudeployed.top/app.html'}});
                if(res.error)showAlert(res.error.message,'error');
                else{showAlert('✅ Account created! Check your email.','success');if(res.data.user)await supabaseClient.from('companies').insert({user_id:res.data.user.id,company_name:company,plan:'free'});}
            }
        }

        window.addEventListener('DOMContentLoaded',function(){init();});
        window.toggleMode=toggleMode;window.googleAuth=googleAuth;window.handleAuth=handleAuth;
    </script>
</body>
</html>
